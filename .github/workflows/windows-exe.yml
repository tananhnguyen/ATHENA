name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
          architecture: x64
      - name: Build Athena.exe
        shell: powershell
        run: .\windows-build\build.ps1
      - name: Check output
        shell: powershell
        run: |
          if (-not (Test-Path dist\Athena.exe)) { throw 'Athena.exe missing' }
          if ((Get-Item dist\Athena.exe).Length -lt 1000000) { throw 'Athena.exe is unexpectedly small' }
      - name: Launch smoke test
        shell: powershell
        run: |
          $process = Start-Process -FilePath (Resolve-Path dist\Athena.exe) -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) { throw "Athena.exe exited during startup with code $($process.ExitCode)" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Athena-Windows
          path: dist/Athena.exe
          if-no-files-found: error
